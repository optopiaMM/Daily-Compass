  # Weeks 2-12 summarised from the plan - fill out in the app week by week.
  - id: W2
    week_of: "2026-06-08"
    parent: Q3-2026
    theme: "IBM decision lands, white paper takes shape"
    capacity_estimate: "~2 Agilia delivery days. BD + content = 8 hrs."
    status: green
    actions: []
    friday_review: { completed: "", slipped_and_why: "", pipeline_moved: "", top_3_next_week: "", rag: "" }
  - id: W3
    week_of: "2026-06-15"
    parent: Q3-2026
    theme: "White paper published, new targets, IBM direct (if applicable)"
    capacity_estimate: "Protect white-paper time above other BD."
    status: green
    actions: []
    friday_review: { completed: "", slipped_and_why: "", pipeline_moved: "", top_3_next_week: "", rag: "" }
  - id: W4
    week_of: "2026-06-22"
    parent: Q3-2026
    theme: "Follow-up and QASR positioning"
    capacity_estimate: "Delivery 2-3 days. BD = 6-8 hrs."
    status: green
    actions: []
    friday_review: { completed: "", slipped_and_why: "", pipeline_moved: "", top_3_next_week: "", rag: "" }

# ---------------------------------------------------------------------
#  DAILY ACTIVITIES - generated by the app from the current week's
#  actions. Shown as an example only.
# ---------------------------------------------------------------------
daily_example:
  date: "2026-06-01"
  main_goal: "W1-A1"
  priorities:
    - ref: "W1-A1"
      note: "Force the Nuvantiq conversation - set the hard decision date today."
    - ref: "W1-A2"
      note: "30 min tracker refresh."
  # Morning drift check reads against this file:
  #   - daily priority ref pointing at parked/done/missing action  -> orphan flag
  #   - a 6 P's pillar with no goal this week                       -> neglect flag
  #   - a track with no action this week near its forcing point     -> track-stall flag
  #   - protected_rule breached                                     -> rule flag
  #   - a failure_trigger 'if' condition met                        -> trigger flag + its 'then'
