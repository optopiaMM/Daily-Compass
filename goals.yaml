        deadline: "2026-06-05"
        success_measure: "Skeleton saved: 4 headers, argument, the questions a head of BP should ask."
        dependency: "None"
        pillar: Promise
        priority: normal
        status: green
      - id: W1-A4
        what: "Agree Associate Engagement Protocol scope with Agilia (Track 3)."
        deadline: "2026-06-05"
