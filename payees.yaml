# =====================================================================
#  PAYSLIP AGENT — STANDING-ORDER BASELINE
#
#  HOW THIS WORKS
#  - This file SEEDS the standing_orders table ONCE. After the app loads
#    it, the database is the source of truth and the agent keeps each
#    amount current automatically.
#  - amount_gbp = what you currently pay this person by standing order.
#  - Each month the agent compares net pay on the payslip against the
#    stored amount. If they match -> "no action". If they differ ->
#    "change £A -> £B", and the stored amount is updated to the new value
#    so next month compares against the latest figure.
# =====================================================================

