# =====================================================================
#  PAYSLIP AGENT — STANDING-ORDER BASELINE
#
#  HOW THIS WORKS
#  - This file SEEDS the standing_orders table ONCE. After the app loads
#    it, the database is the source of truth and the agent keeps each
#    amount current automatically.
#  - amount_gbp = what you currently pay this person by standing order.
#  - Each month the agent compares net pay on the payslip against the
#    stored amount. If they match -> "no action". If they differ ->
#    "change £A -> £B", and the stored amount is updated to the new value
#    so next month compares against the latest figure.
# =====================================================================

config:
  # The accountant's sending address the agent looks for each month.
  # Can also be set via the ACCOUNTANT_EMAIL env var (env wins if set).
  accountant_email: "rachel.madden-bandey@carpenterbox.com"

# aliases: optional alternate names the payee appears under in the payroll
# documents. The BACS Pay Transfer Report lists people as "E Mills" / "M Mills"
# (sometimes "Mrs. E Mills" / "Mr. M Mills"), but the baseline uses full names.
# Matching strips any title and is case-insensitive, so "Mrs. E Mills" still
# resolves via the "E Mills" alias.
payees:
  - name: "Mark Mills"
    amount_gbp: 965.10
    aliases: ["M Mills", "Mr. M Mills"]
  - name: "Lizzie Mills"
    amount_gbp: 1047.50
    aliases: ["E Mills", "Mrs. E Mills"]
