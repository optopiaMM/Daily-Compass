# =====================================================================
#  DAILY COMPASS — GOALS CASCADE
#  Annual target  ->  90-day goal  ->  weekly goals  ->  daily activities
#
#  HOW TO USE THIS FILE
#  - This file is the ONE-TIME SEED for the app's goal tables.
#    After the app loads it once, the database is the source of truth
#    and you manage goals in the app (not by editing this file).
#  - STATUS values: green | amber | red | done | parked
#    (green = on track, amber = slipping but recoverable, red = needs
#     a strategy change.)
# =====================================================================

annual_target:
  id: AT1
  title: "Replace day-job income with sustainable Optopia revenue"
  measure: "Monthly revenue held at or above £8k from diversified sources (£6-7k flex while building)"
  horizon: "2026"
  status: amber
  # Carried in from Q1: £8k+ achieved for 2+ months, but not yet secured
  # forward beyond current work. Holding, not yet sustained.

ninety_day_goal:
  id: Q3-2026
  period: "June - August 2026"
  label: "Conversion Quarter"
  parent: AT1
  status: green
  goal: >
    Resolve IBM (signed or dropped) within 2 weeks; convert QASR on the
    Southern Water framework decision; keep Agilia delivering and apply
    the Associate Engagement Protocol; publish a first-mover PR29-delivery
    white paper ahead of 17 August; and add enough pipeline to cover the
    forward income gap.
  why: >
    Last quarter proved the model works at the unit level - one engagement,
    one validated rate (£900/day banked via Agilia). This quarter has to
    prove it sustains: turn warm conversations into signed work, avoid
    over-dependence on Agilia alone, and convert the highest-value
    opportunity (QASR at direct-advisory rates) that could pull Phase 2
    forward.

  # Honest position carried in from March-May, the evidence base.
  status_at_start:
    - item: "Prev. 90-day goal"
      status: "£8k/month for 2+ months; one associate active; forward income not yet secured"
      rag: amber
    - item: "Agilia"
      status: "CONVERTED. £900/day, 1-3 d/wk. First banked associate engagement"
      rag: green
    - item: "QASR"
      status: "Warm. ~£1,600+/day (direct-advisory tier). Gated on Southern Water framework (~60 days)"
      rag: amber
    - item: "IBM / Nuvantiq"
      status: "Two-stage. ~£2.5k/3 days + commission. Go/no-go due within 2 weeks"
      rag: amber
    - item: "Day-rate validation"
      status: "RESOLVED. £900/day banked - the critical financial unknown is answered"
      rag: green
    - item: "Content / thought leadership"
      status: "Replaced stalled Ofwat-dependent plan with PR29-delivery white paper anchored to DCAF + 17 Aug deadline"
      rag: amber

  # The three parallel conversion tracks. Each has a forcing point the
  # drift check can watch.
  tracks:
    - id: T1
      name: "IBM / Nuvantiq - resolve in 2 weeks (sign or drop)"
      forcing_point: "Nuvantiq go/no-go by ~12 Jun. Binary: make it happen or forget it."
      note: "Nuvantiq no-go is the gate that legitimises the direct IBM route. If Nuvantiq stays live, the direct path stays closed."
      status: amber
    - id: T2
      name: "QASR - convert on Southern Water framework (~60 days)"
      forcing_point: "External trigger ~early Aug. Be so ready the booking follows the moment it lands. Rate agreed by mid-Jul."
      status: amber
    - id: T3
      name: "Agilia - sustain, and bridge to direct work"
      forcing_point: "Apply Associate Engagement Protocol; surface long-term contract explicitly."
      status: green

  success_indicators:
    - "IBM resolved cleanly - signed (Nuvantiq or direct) or deliberately dropped"
    - "QASR converted on the framework decision, or concrete dated next step at £1,600+/day"
    - "Agilia sustained; long-term contract surfaced; Protocol producing a direct WC touchpoint"
    - "White paper published before mid-Aug; third article timed to 17 Aug; non-peer conversations"
    - "Forward income gap closed: pipeline showing signed or near-signed work beyond current engagements"
    - "Monthly revenue held at or above £8k with diversified sources"
  failure_indicators:
    - "IBM still 'ongoing' at quarter end - drifted a third quarter without a decision"
    - "Framework landed but QASR did not convert - highest-value opportunity slipped"
    - "Agilia the only income; still entirely under partner brand with no Optopia recognition"
    - "Content slipped again - the 17 Aug first-mover moment missed"
    - "Income still secured only month-to-month; nothing signed for Sep onward"
    - "Revenue below the £6k flex threshold, or wholly dependent on one engagement"

  # Mid-quarter triggers, each paired with your prescribed response.
  failure_triggers:
    - if: "Nuvantiq won't give a clear decision"
      then: "Set a hard deadline; state silence will be treated as no-go. Don't let it occupy a third quarter. Keep the direct route clean by not pre-empting it."
    - if: "Southern Water framework slips beyond the quarter"
      then: "Don't let QASR go cold. Keep warm with white paper + value-add note; lean harder on new targets to cover the gap."
    - if: "Agilia stays at 1 day/week, not 3"
      then: "Surface the long-term contract conversation directly; accelerate new targets. One engagement at low utilisation won't hold £8k/month."
    - if: "White paper not landing with the right audience"
      then: "Reread target-audience posts; rewrite from their vantage point. Time the next piece to 17 Aug, not a quiet week."
    - if: "Forward gap not closing"
      then: "Treat new-target outreach as priority over content for a fortnight; use the white paper as door-opener, not cold approach."

  # Standing rules carried forward - the app can enforce these daily.
  protected_rule: "Content morning slot is non-negotiable - defend it like a client commitment. Flag any day delivery work displaces it."
  operating_systems:
    - "Protected content morning (defended like a client commitment)"
    - "20-minute Friday review (RAG + what moved + top 3 next week)"
    - "Pipeline tracker updated every Friday - 'rate discussed?' is the most important field"

